<script type="text/babel">

/* ── Orion icon ── */
const OrionIcon = ({ size = 28 }) => (
  <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="18" stroke="#2a2a2a" strokeWidth="2" fill="none"/>
    <ellipse cx="20" cy="20" rx="18" ry="7" stroke="#2a2a2a" strokeWidth="2" fill="none" transform="rotate(-30 20 20)"/>
    <circle cx="20" cy="20" r="4" fill="#2a2a2a"/>
  </svg>
);

/* ── Sketch primitives ── */
const Box = ({ w, h, r=4, bg="#e8e3dc", border="#2a2a2a", bw=1.5, style={}, children }) => (
  <div style={{
    width: w, height: h, borderRadius: r,
    background: bg, border: `${bw}px solid ${border}`,
    position: 'relative', overflow: 'hidden',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    flexShrink: 0,
    ...style
  }}>{children}</div>
);

const Label = ({ children, size=13, color="#444", bold=false, center=false, style={} }) => (
  <span style={{
    fontFamily: "'Caveat', cursive",
    fontSize: size, color, fontWeight: bold ? 700 : 400,
    textAlign: center ? 'center' : 'left',
    lineHeight: 1.3,
    ...style
  }}>{children}</span>
);

const Pill = ({ children, bg="#2a2a2a", color="#fff", w, style={} }) => (
  <div style={{
    background: bg, color, borderRadius: 100,
    padding: '4px 12px', fontFamily: "'Caveat', cursive",
    fontSize: 12, width: w, textAlign: 'center',
    border: '1.5px solid #2a2a2a',
    ...style
  }}>{children}</div>
);

const Divider = () => <div style={{ width: '100%', height: 1, background: '#2a2a2a', opacity: 0.2, margin: '4px 0' }} />;

const SketchLine = ({ w='100%', h=10, style={} }) => (
  <div style={{ width: w, height: h, borderRadius: 3, background: '#ccc', ...style }} />
);

/* ── Annotation arrow ── */
const Note = ({ text, top, left, right, bottom, arrowDir='left' }) => (
  <div style={{
    position: 'absolute', top, left, right, bottom,
    display: 'flex', alignItems: 'center', gap: 4,
    pointerEvents: 'none', zIndex: 10
  }}>
    <Label size={11} color="#888">{text}</Label>
  </div>
);

═══════════════════════════════════ */
