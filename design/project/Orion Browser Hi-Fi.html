<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion Browser — Hi-Fi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0e0e14; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>
<div id="root" style="width:100vw;height:100vh;"></div>
<script type="text/babel">

/* ─── DESIGN TOKENS ─── */
const D = {
  bg: '#08080F',
  surface: '#101018',
  elevated: '#17172280',
  border: '#252538',
  borderHi: '#35355a',
  accent: '#7B6EF5',
  accentGlow: '#7B6EF540',
  teal: '#36C9B0',
  text: '#F0EFF8',
  textMid: '#9994B8',
  textDim: '#504E68',
  pill: '#14142080',
};
const L = {
  bg: '#F4F3F8',
  surface: '#FFFFFF',
  elevated: '#ECE9F8',
  border: '#E0DCF3',
  borderHi: '#C8C2EE',
  accent: '#6B5EE4',
  accentGlow: '#6B5EE420',
  teal: '#1DB89D',
  text: '#14122A',
  textMid: '#6B6585',
  textDim: '#BAAFCC',
  pill: '#FFFFFFD0',
};

/* ─── ORION ICON ─── */
const OrionIcon = ({ size = 28, color = '#7B6EF5', glow = false }) => (
  <svg width={size} height={size} viewBox="0 0 40 40" fill="none" style={glow ? { filter: `drop-shadow(0 0 6px ${color}88)` } : {}}>
    <circle cx="20" cy="20" r="17" stroke={color} strokeWidth="2.5" fill="none" opacity="0.4"/>
    <ellipse cx="20" cy="20" rx="17" ry="6.5" stroke={color} strokeWidth="2.5" fill="none" transform="rotate(-32 20 20)"/>
    <circle cx="20" cy="20" r="4.5" fill={color}/>
    <circle cx="20" cy="20" r="2" fill="#fff" opacity="0.7"/>
  </svg>
);

const OrionLogo = ({ size = 36, t }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
    <OrionIcon size={size} color={t.accent} glow />
    <span style={{ fontSize: size * 0.55, fontWeight: 700, color: t.text, letterSpacing: '-0.02em' }}>orion</span>
  </div>
);

/* ─── SHARED PRIMITIVES ─── */
const StatusBar = ({ t }) => (
  <div style={{ height: 44, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 22px', flexShrink: 0 }}>
    <span style={{ fontSize: 15, fontWeight: 700, color: t.text }}>9:41</span>
    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
      <svg width="17" height="12" viewBox="0 0 17 12" fill={t.textMid}><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke={t.textMid} strokeWidth="1.5"><path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2M1.5 5.2C3.2 3.5 5.5 2.5 8 2.5M5.5 7.8C6.3 7 7.1 6.5 8 6.5C8.9 6.5 9.7 7 10.5 7.8M8 11.5V11.4"/></svg>
      <div style={{ display: 'flex', gap: 1.5, alignItems: 'center' }}>
        <div style={{ width: 24, height: 12, borderRadius: 4, border: `1.5px solid ${t.textMid}`, position: 'relative', display: 'flex', alignItems: 'center', padding: '2px 3px' }}>
          <div style={{ width: '70%', height: '100%', background: t.text, borderRadius: 2 }}/>
          <div style={{ width: 2.5, height: 5, background: t.textMid, borderRadius: 1, position: 'absolute', right: -4 }}/>
        </div>
      </div>
    </div>
  </div>
);

const HomeIndicator = ({ t }) => (
  <div style={{ height: 34, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
    <div style={{ width: 134, height: 5, borderRadius: 3, background: t.text, opacity: 0.25 }}/>
  </div>
);

/* ─── PILL NAV BAR ─── */
const PillBar = ({ t, url = null, showBack = false }) => (
  <div style={{ padding: '8px 16px 0', flexShrink: 0 }}>
    <div style={{
      background: t.pill,
      backdropFilter: 'blur(24px)',
      WebkitBackdropFilter: 'blur(24px)',
      border: `1px solid ${t.borderHi}`,
      borderRadius: 28,
      padding: '8px 12px',
      display: 'flex',
      alignItems: 'center',
      gap: 8,
      boxShadow: `0 8px 32px ${t.bg}60, 0 0 0 0.5px ${t.border}`,
    }}>
      {showBack && (
        <button style={{ background: 'none', border: 'none', padding: '4px 2px', cursor: 'pointer', color: t.textMid, display: 'flex' }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      )}
      <div style={{
        flex: 1,
        background: url ? t.elevated : `${t.accent}18`,
        border: `1px solid ${url ? t.border : t.accent + '44'}`,
        borderRadius: 20,
        padding: '7px 14px',
        display: 'flex',
        alignItems: 'center',
        gap: 7,
        minWidth: 0,
      }}>
        {url ? (
          <>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={t.teal} strokeWidth="2.5" strokeLinecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span style={{ fontSize: 14, fontWeight: 500, color: t.textMid, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{url}</span>
          </>
        ) : (
          <>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={t.accent} strokeWidth="2.2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <span style={{ fontSize: 14, color: t.textDim }}>Search or enter address…</span>
          </>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <button style={{ background: 'none', border: 'none', padding: '4px', cursor: 'pointer', color: t.textMid, display: 'flex' }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button style={{ background: 'none', border: 'none', padding: '4px', cursor: 'pointer', color: t.textMid, display: 'flex' }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
    </div>
  </div>
);

/* ─── SCREEN: HOME ─── */
const HomeScreen = ({ t }) => {
  const sites = [
    { label: 'YouTube', color: '#FF3333', letter: 'YT' },
    { label: 'Maps', color: '#34A853', letter: 'M' },
    { label: 'GitHub', color: '#6E5494', letter: 'GH' },
    { label: 'Reddit', color: '#FF6314', letter: 'R' },
    { label: 'Figma', color: '#9747FF', letter: 'F' },
    { label: 'Drive', color: '#1BA462', letter: 'D' },
    { label: 'Mail', color: '#4285F4', letter: 'M' },
    { label: 'News', color: '#EA4335', letter: 'N' },
  ];
  const recents = [
    { label: 'apurba.tech', sub: 'Just now', color: '#7B6EF5' },
    { label: 'github.com/explore', sub: '2 min ago', color: '#6E5494' },
    { label: 'figma.com', sub: '1 hour ago', color: '#9747FF' },
  ];
  return (
    <div style={{ background: t.bg, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
      {/* Ambient glow */}
      <div style={{ position: 'absolute', top: 60, left: '50%', transform: 'translateX(-50%)', width: 260, height: 260, borderRadius: '50%', background: `radial-gradient(circle, ${t.accentGlow} 0%, transparent 70%)`, pointerEvents: 'none', zIndex: 0 }}/>
      <StatusBar t={t} />
      {/* Greeting + logo */}
      <PillBar t={t} />
      <div style={{ padding: '16px 24px 12px', position: 'relative', zIndex: 1 }}>
        <OrionLogo size={28} t={t} />
        <p style={{ fontSize: 13, color: t.textDim, marginTop: 4, fontWeight: 400 }}>Monday, April 28</p>
      </div>
      {/* Quick Access */}
      <div style={{ padding: '0 20px 20px', position: 'relative', zIndex: 1 }}>
        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: t.textDim, textTransform: 'uppercase', marginBottom: 14 }}>Quick Access</p>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '16px 12px' }}>
          {sites.map(s => (
            <div key={s.label} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
              <div style={{
                width: 52, height: 52, borderRadius: 16,
                background: `${s.color}18`,
                border: `1px solid ${s.color}30`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: `0 2px 12px ${s.color}18`,
              }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: s.color }}>{s.letter}</span>
              </div>
              <span style={{ fontSize: 11, color: t.textMid, fontWeight: 400 }}>{s.label}</span>
            </div>
          ))}
        </div>
      </div>
      {/* Divider */}
      <div style={{ margin: '0 20px', height: 1, background: t.border, flexShrink: 0 }}/>
      {/* Recents */}
      <div style={{ padding: '16px 20px', flex: 1, position: 'relative', zIndex: 1 }}>
        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: t.textDim, textTransform: 'uppercase', marginBottom: 12 }}>Recent</p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {recents.map(r => (
            <div key={r.label} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderRadius: 14, background: t.elevated || t.surface, border: `1px solid ${t.border}` }}>
              <div style={{ width: 34, height: 34, borderRadius: 10, background: `${r.color}20`, border: `1px solid ${r.color}30`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <div style={{ width: 8, height: 8, borderRadius: '50%', background: r.color }}/>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontSize: 14, fontWeight: 500, color: t.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.label}</p>
              </div>
              <span style={{ fontSize: 11, color: t.textDim, flexShrink: 0 }}>{r.sub}</span>
            </div>
          ))}
        </div>
      </div>
      <HomeIndicator t={t} />
    </div>
  );
};

/* ─── SCREEN: ADDRESS BAR ─── */
const AddressScreen = ({ t }) => {
  const suggestions = [
    { icon: '🕐', text: 'figma.com/design', tag: 'recent' },
    { icon: '🔖', text: 'figma.com', tag: 'bookmark' },
    { icon: '🔍', text: 'figma tutorial 2025', tag: 'search' },
    { icon: '🕐', text: 'figma.com/community', tag: 'recent' },
    { icon: '🔍', text: 'figma pricing', tag: 'search' },
  ];
  const tagColors = { recent: t.accent, bookmark: t.teal, search: t.textDim };
  return (
    <div style={{ background: t.bg, display: 'flex', flexDirection: 'column', height: '100%' }}>
      <StatusBar t={t} />
      {/* Active bar */}
      <div style={{ padding: '8px 16px 12px', display: 'flex', gap: 10, alignItems: 'center' }}>
        <div style={{
          flex: 1,
          background: t.surface,
          border: `1.5px solid ${t.accent}`,
          borderRadius: 26,
          padding: '10px 16px',
          display: 'flex',
          alignItems: 'center',
          gap: 9,
          boxShadow: `0 0 0 4px ${t.accentGlow}`,
        }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={t.accent} strokeWidth="2.2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span style={{ fontSize: 15, color: t.text, flex: 1 }}>figma.com</span>
          <div style={{ width: 2, height: 18, background: t.accent, borderRadius: 1, animation: 'blink 1s step-end infinite' }}/>
        </div>
        <button style={{ background: 'none', border: 'none', color: t.accent, fontSize: 15, fontWeight: 600, fontFamily: 'DM Sans', cursor: 'pointer', flexShrink: 0 }}>Cancel</button>
      </div>
      <style>{`@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }`}</style>
      {/* Suggestions */}
      <div style={{ flex: 1, overflow: 'hidden' }}>
        {suggestions.map((s, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '13px 20px', borderBottom: `1px solid ${t.border}` }}>
            <div style={{ width: 36, height: 36, borderRadius: 10, background: t.surface, border: `1px solid ${t.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 }}>
              {s.icon}
            </div>
            <span style={{ flex: 1, fontSize: 15, color: t.text, fontWeight: 400 }}>{s.text}</span>
            <span style={{ fontSize: 11, fontWeight: 600, color: tagColors[s.tag], textTransform: 'uppercase', letterSpacing: '0.06em' }}>{s.tag}</span>
          </div>
        ))}
      </div>
      {/* Keyboard */}
      <div style={{ background: t === L ? '#D1CEDF' : '#1A1A28', flexShrink: 0, paddingTop: 10 }}>
        {[
          ['Q','W','E','R','T','Y','U','I','O','P'],
          ['A','S','D','F','G','H','J','K','L'],
          ['⇧','Z','X','C','V','B','N','M','⌫'],
        ].map((row, ri) => (
          <div key={ri} style={{ display: 'flex', justifyContent: 'center', gap: 6, marginBottom: 8 }}>
            {row.map(k => (
              <div key={k} style={{
                width: k.length > 1 ? 44 : 33, height: 42, borderRadius: 8,
                background: k === '⇧' || k === '⌫' ? (t === L ? '#B8B4CB' : '#272738') : (t === L ? '#FFFFFF' : '#222234'),
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: k.length > 1 ? 17 : 15,
                fontWeight: 500, color: t.text,
                boxShadow: `0 2px 0 ${t === L ? '#B0ACBF' : '#0a0a14'}`,
                fontFamily: 'DM Sans',
              }}>{k}</div>
            ))}
          </div>
        ))}
        <div style={{ display: 'flex', justifyContent: 'center', gap: 6, paddingBottom: 6 }}>
          {[['123', 72], ['space', 186], ['Go', 72]].map(([k, w]) => (
            <div key={k} style={{
              width: w, height: 42, borderRadius: 8,
              background: k === 'Go' ? t.accent : (t === L ? '#FFFFFF' : '#222234'),
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 15, fontWeight: k === 'Go' ? 700 : 400,
              color: k === 'Go' ? '#fff' : t.text,
              boxShadow: k === 'Go' ? `0 2px 12px ${t.accent}60` : `0 2px 0 ${t === L ? '#B0ACBF' : '#0a0a14'}`,
              fontFamily: 'DM Sans',
            }}>{k}</div>
          ))}
        </div>
        <HomeIndicator t={t} />
      </div>
    </div>
  );
};

/* ─── SCREEN: BROWSING ─── */
const BrowsingScreen = ({ t }) => (
  <div style={{ background: t.bg, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
    <StatusBar t={t} />
    <PillBar t={t} url="figma.com" showBack />
    {/* Page content */}
    <div style={{ flex: 1, background: t === L ? '#fff' : '#0E0E18', overflow: 'hidden', display: 'flex', flexDirection: 'column', position: 'relative' }}>
      {/* Simulated webpage */}
      <div style={{ padding: '0 0 0 0', flex: 1 }}>
        {/* Page hero */}
        <div style={{ height: 200, background: t === L ? 'linear-gradient(135deg, #7B6EF520, #36C9B020)' : 'linear-gradient(135deg, #7B6EF530, #36C9B030)', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: '0 20px 20px', borderBottom: `1px solid ${t.border}` }}>
          <div style={{ width: 48, height: 48, borderRadius: 14, background: t.accent, marginBottom: 12, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ fontSize: 22, color: '#fff', fontWeight: 700 }}>F</span>
          </div>
          <div style={{ height: 20, width: '65%', borderRadius: 6, background: t.textMid, opacity: 0.5, marginBottom: 8 }}/>
          <div style={{ height: 13, width: '45%', borderRadius: 4, background: t.textDim, opacity: 0.4 }}/>
        </div>
        <div style={{ padding: '20px 20px 0' }}>
          {[90,100,80,100,70,95,85].map((w,i) => (
            <div key={i} style={{ height: i===0?16:12, width: `${w}%`, borderRadius: 4, background: t.border, marginBottom: i===0?14:8 }}/>
          ))}
        </div>
      </div>
    </div>
    <HomeIndicator t={t} />
  </div>
);

/* ─── SCREEN: TABS ─── */
const TabsScreen = ({ t }) => {
  const tabs = [
    { label: 'Figma — Design Tool', url: 'figma.com', color: '#9747FF', active: true },
    { label: 'GitHub Explore', url: 'github.com', color: '#6E5494', active: false },
    { label: 'Apurba Tech', url: 'apurba.tech', color: '#7B6EF5', active: false },
  ];
  return (
    <div style={{ background: t.bg, display: 'flex', flexDirection: 'column', height: '100%' }}>
      <StatusBar t={t} />
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '4px 20px 16px' }}>
        <span style={{ fontSize: 22, fontWeight: 700, color: t.text, letterSpacing: '-0.02em' }}>3 Tabs</span>
        <div style={{ display: 'flex', gap: 8 }}>
          <button style={{ background: t.elevated || `${t.accent}18`, border: `1px solid ${t.border}`, borderRadius: 20, padding: '7px 16px', color: t.accent, fontSize: 14, fontWeight: 600, fontFamily: 'DM Sans', cursor: 'pointer' }}>+ New</button>
        </div>
      </div>
      {/* Tab grid */}
      <div style={{ flex: 1, padding: '0 16px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, alignContent: 'start' }}>
        {[...tabs, null].map((tab, i) => (
          tab ? (
            <div key={i} style={{
              borderRadius: 18,
              border: `${tab.active ? 2 : 1}px solid ${tab.active ? t.accent : t.border}`,
              overflow: 'hidden',
              boxShadow: tab.active ? `0 0 0 3px ${t.accentGlow}` : 'none',
              height: 168,
              display: 'flex', flexDirection: 'column',
              background: t.surface,
            }}>
              {/* Tab chrome */}
              <div style={{ background: t.elevated || t.surface, padding: '9px 12px', display: 'flex', alignItems: 'center', gap: 8, borderBottom: `1px solid ${t.border}` }}>
                <div style={{ width: 18, height: 18, borderRadius: 6, background: `${tab.color}30`, border: `1px solid ${tab.color}40`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <div style={{ width: 7, height: 7, borderRadius: '50%', background: tab.color }}/>
                </div>
                <span style={{ fontSize: 11, color: t.textMid, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{tab.url}</span>
                <span style={{ fontSize: 15, color: t.textDim, lineHeight: 1 }}>✕</span>
              </div>
              {/* Preview */}
              <div style={{ flex: 1, padding: 10, display: 'flex', flexDirection: 'column', gap: 6 }}>
                <div style={{ height: 10, width: '70%', borderRadius: 3, background: t.border }}/>
                <div style={{ height: 8, width: '90%', borderRadius: 3, background: `${t.border}80` }}/>
                <div style={{ height: 8, width: '60%', borderRadius: 3, background: `${t.border}60` }}/>
                <div style={{ height: 40, borderRadius: 8, background: `${tab.color}12`, border: `1px solid ${tab.color}20`, marginTop: 4 }}/>
              </div>
            </div>
          ) : (
            <div key={i} style={{ height: 168, borderRadius: 18, border: `1.5px dashed ${t.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ width: 36, height: 36, borderRadius: '50%', background: t.elevated || `${t.accent}10`, border: `1.5px solid ${t.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ fontSize: 22, color: t.textDim, lineHeight: 1 }}>+</span>
              </div>
            </div>
          )
        ))}
      </div>
      {/* Tab bar bottom */}
      <div style={{ padding: '12px 16px 4px' }}>
        <div style={{ background: t.pill, backdropFilter: 'blur(24px)', border: `1px solid ${t.border}`, borderRadius: 28, padding: '10px 20px', display: 'flex', justifyContent: 'space-around', alignItems: 'center' }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: t.accent }}>Done</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={t.textMid} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span style={{ fontSize: 14, fontWeight: 500, color: t.textMid }}>Private</span>
        </div>
